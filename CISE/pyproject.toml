[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cise"
version = "0.2.2"
description = "CISE conformal interval materials search: data-free research code"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.11,<2", "scikit-learn>=1.4,<2",
  "pymatgen>=2024.10.29", "joblib>=1.3,<2", "jsonschema>=4.20,<5",
  "requests>=2.31,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.9", "twine>=5"]
alignn = ["torch>=2.2", "dgl==1.1.3", "jarvis-tools>=2022.9.16", "alignn"]

[project.scripts]
cise = "cise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
